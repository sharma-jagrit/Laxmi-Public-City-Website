<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laxmi Public City - Udaipur</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="laxmi_icon_32x32.png">
    <style>
        :root {
            --white-color: #fff;
            --dark-color: #252525;
            --primary-color: #3b141c;
            --secondary-color: #f3961c;
            --light-pink-color: #faf4f5;
            --medium-gray-color: #ccc;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark-color);
        }

        .book-space-container {
            max-width: 650px;
            width: 100%;
            margin: 20px;
            padding: 25px;
            background: var(--light-pink-color);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .form-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .form-header .logo-left img {
            width: 80px;
            margin-right: 15px;
        }

        .form-header .title-right h2 {
            margin: 0;
            color: var(--primary-color);
        }

        .form-header .title-right p {
            margin: 0;
            font-weight: bold;
            color: var(--dark-color);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        .form-group input {
            width: 100%;
            padding: 10px 2px;
            border: 1px solid var(--medium-gray-color);
            border-radius: 6px;
            outline: none;
            background: var(--white-color);
            color: var(--dark-color);
        }

        .form-group input::placeholder {
            color: #777;
        }

        .form-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid var(--medium-gray-color);
            border-radius: 8px;
            background: #fff;
        }

        .form-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--primary-color);
            text-align: left;
            border-bottom: 1px solid var(--medium-gray-color);
            padding-bottom: 5px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: var(--white-color);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--secondary-color);
        }

        #formMessage {
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Bookspace Form  Sectoin Start-->
    <div class="book-space-container">
        <div class="form-header">
            <div class="logo-left">
                <img src="/image/Logo.png" alt="Laxmi PubliCity Logo">
            </div>
            <div class="title-right">
                <h2>Laxmi PubliCity</h2>
                <p>18 • 19 • 20 Dec. 2025</p>
            </div>
        </div>

        <form id="bookSpaceForm" onsubmit="submitForm(event)">
            <!-- Contact Details -->
            <div class="form-section">
                <h3>Contact Details</h3>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" name="company" placeholder="Your Company Name">
                </div>
                <div class="form-group">
                    <label>Name*</label>
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Phone*</label>
                    <input type="text" name="phone" placeholder="Your Phone Number" required>
                </div>
                <div class="form-group">
                    <label>Email*</label>
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
            </div>

            <!-- Address Details -->
            <div class="form-section">
                <h3>Address Details</h3>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="Your Address">
                </div>
                <div class="form-group">
                    <label>Street*</label>
                    <input type="text" name="street" placeholder="Street" required>
                </div>
                <div class="form-group">
                    <label>City/Suburb</label>
                    <input type="text" name="city" placeholder="City or Suburb">
                </div>
                <div class="form-group">
                    <label>State*</label>
                    <input type="text" name="state" placeholder="State" required>
                </div>
                <div class="form-group">
                    <label>Zip/Post Code*</label>
                    <input type="text" name="zip" placeholder="Zip or Post Code" required>
                </div>
                <div class="form-group">
                    <label>Country*</label>
                    <input type="text" name="country" placeholder="Country" required>
                </div>
            </div>

            <!-- Business Details -->
            <div class="form-section">
                <h3>Business Details</h3>
                <div class="form-group">
                    <label>GST Number</label>
                    <input type="text" name="gst" placeholder="Your GST Number">
                </div>
                <div class="form-group">
                    <label>Your Product Categories</label>
                    <input type="text" name="categories" placeholder="Electronics, Textiles, Food...">
                </div>
                <div class="form-group">
                    <label>Space Requirement</label>
                    <input type="text" name="space" placeholder="Stall Size / Space Requirement">
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
            <p id="formMessage"></p>
        </form>
    </div>
    <!--Bookkspace From Section End-->

    <!--Bookspace Submit From Script Start-->
    <script>
        function submitForm(event) {
            event.preventDefault();
            const form = document.getElementById("bookSpaceForm");
            const formData = new FormData(form);

            const scriptURL = "https://script.google.com/macros/s/AKfycbwmtsvoqg79XyLwsZdCZnMP164xiLnE3wJ2qaujGCKPvSRs7UxP2Ih20qPM48GPELD5/exec";

            fetch(scriptURL, { method: "POST", body: formData })
                .then(response => {
                    document.getElementById("formMessage").innerText = "✅ Form submitted successfully!";
                    form.reset();
                })
                .catch(error => {
                    document.getElementById("formMessage").innerText = "❌ Submission failed. Please try again.";
                });
        }
    </script>
    <!--Bookspace Submit From Script End-->
</body>

</html>
